{{- if and .Values.nodeExporter.enabled .Values.nodeExporter.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ default (include "observability.nodeExporter.fullname" .) .Values.nodeExporter.serviceAccount.name }}
  namespace: {{ include "observability.namespace" . }}
  labels:
    {{- include "observability.nodeExporter.labels" . | nindent 4 }}
  {{- with .Values.nodeExporter.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
