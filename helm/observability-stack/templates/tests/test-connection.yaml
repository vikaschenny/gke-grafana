apiVersion: v1
kind: Pod
metadata:
  name: {{ include "observability.fullname" . }}-test
  namespace: {{ include "observability.namespace" . }}
  labels:
    {{- include "observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: helm-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        capabilities:
          drop: ["ALL"]
      command:
        - /bin/sh
        - -c
        - |
          wget -qO- http://{{ include "observability.grafana.fullname" . }}:{{ .Values.grafana.service.port }}/api/health &&
          wget -qO- http://{{ include "observability.prometheus.fullname" . }}:{{ .Values.prometheus.service.port }}/-/ready
