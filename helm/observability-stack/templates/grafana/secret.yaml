{{- if and .Values.grafana.enabled (not .Values.grafana.existingSecret) }}
{{- $secretName := include "observability.grafana.secretName" . -}}
{{- $existing := lookup "v1" "Secret" (include "observability.namespace" .) $secretName -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ include "observability.namespace" . }}
  labels:
    {{- include "observability.grafana.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $existing }}
  admin-user: {{ index $existing.data "admin-user" | default (.Values.grafana.adminUser | b64enc) }}
  admin-password: {{ index $existing.data "admin-password" }}
  {{- else }}
  admin-user: {{ .Values.grafana.adminUser | b64enc }}
  admin-password: {{ .Values.grafana.adminPassword | default (randAlphaNum 24) | b64enc }}
  {{- end }}
{{- end }}
