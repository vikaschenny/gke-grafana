apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    app.kubernetes.io/name: observability-stack
    app.kubernetes.io/part-of: observability-stack
    compliance: mnc-standard
    # GKE 1.35 baseline:latest blocks hostNetwork, hostPID, hostPath, and hostPort.
    # Node Exporter needs those, so enforce is privileged for this namespace only.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    description: Isolated observability namespace with MNC security controls
